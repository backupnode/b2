<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BACKUPNODE</title>
  
  <!-- Green Terminal SVG Favicon -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23000800'/><rect x='2' y='2' width='28' height='28' rx='4' fill='none' stroke='%23004d12' stroke-width='1.5'/><path d='M8 10L14 16L8 22' stroke='%2300ff41' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/><rect x='17' y='20' width='7' height='2.5' rx='1' fill='%2300ff41'/></svg>" />
  
  <style>
    :root {
      --bg: #000800;
      --panel: #010a01;
      --border: #003300;
      --border-bright: #005511;
      --w80: #00cc33;
      --w60: #008f23;
      --w30: #004d12;
      --ok: #00ff41;
      --hi: #bcffd0;
      --ts: #007722;
      --info: #33ff77;
      --glow: 0 0 8px rgba(0, 255, 65, 0.4);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: "SF Mono", "Fira Code", "Cascadia Mono", monospace;
      color: var(--w80);
      overflow: hidden;
    }

    /* CRT scanline overlay */
    body::after {
      content: " ";
      position: fixed; inset: 0;
      background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.1) 50%);
      background-size: 100% 3px;
      pointer-events: none; z-index: 1000; opacity: 0.2;
    }

    .terminal {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* HEADER */
    .header {
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      display: flex; align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .brand { 
      font-weight: 900; 
      letter-spacing: 0.2em; 
      color: var(--ok); 
      font-size: 14px; 
      text-shadow: var(--glow);
      flex-shrink: 0;
    }
    .brand-sub { 
      font-size: 10px; 
      opacity: 0.75; 
      letter-spacing: 0.1em; 
      color: var(--w80);
      transition: opacity 0.3s ease, color 0.3s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .brand-sub.highlight {
      opacity: 1;
      color: var(--hi);
      text-shadow: var(--glow);
    }

    .telemetry-container {
      padding: 8px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 10, 0, 0.6);
      flex-shrink: 0;
      display: flex;
      align-items: center;
    }

    .telemetry-badge {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-around;
      background: rgba(0, 255, 65, 0.03);
      border: 1px solid var(--border-bright);
      border-radius: 6px;
      padding: 8px 12px;
      box-shadow: inset 0 0 10px rgba(0, 255, 65, 0.03), 0 0 8px rgba(0, 255, 65, 0.05);
    }

    .stat-item { 
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      position: relative;
    }

    .stat-item:not(:last-child)::after {
      content: "";
      position: absolute;
      right: 0;
      top: 15%;
      height: 70%;
      width: 1px;
      background: var(--border-bright);
      opacity: 0.6;
    }

    .stat-label { 
      font-size: 8px; 
      color: var(--w60); 
      text-transform: uppercase; 
      letter-spacing: 0.05em;
      margin-bottom: 2px; 
    }

    .stat-value { 
      font-size: 12px; 
      font-weight: 600;
      color: var(--ok); 
      font-variant-numeric: tabular-nums; 
    }

    .log-viewport {
      flex: 1;
      overflow-y: scroll;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      position: relative;
      background: radial-gradient(circle at center, #011501 0%, #000800 100%);
    }
    .log-viewport::-webkit-scrollbar { display: none; }

    .log-fade-top {
      position: sticky; top: 0; left: 0; right: 0; height: 40px;
      background: linear-gradient(var(--bg), transparent);
      pointer-events: none; z-index: 5;
      margin-bottom: -40px;
    }

    .log-stream {
      padding: 15px 0 10px;
      display: flex; flex-direction: column;
      min-height: 100%;
      justify-content: flex-end;
    }

    .log-entry {
      display: flex;
      gap: 8px;
      padding: 3px 20px;
      font-size: 11px; line-height: 1.5;
      opacity: 0;
      animation: scan-in 0.12s ease-out forwards;
    }
    @keyframes scan-in {
      from { transform: translateY(4px); opacity: 0; }
      to   { transform: translateY(0);   opacity: 0.85; }
    }
    .log-entry:last-child {
      opacity: 1 !important;
      background: rgba(0, 255, 65, 0.04);
      border-left: 3px solid var(--ok);
      padding-left: 17px;
    }

    .le-prefix {
      color: var(--ts);
      font-weight: bold;
      user-select: none;
      flex-shrink: 0;
    }
    .le-msg { color: var(--w80); word-break: break-word; }
    .le-msg.bright { color: var(--hi); }
    .le-msg.success { color: var(--info); }

    .cursor {
      display: inline-block; width: 7px; height: 12px;
      background: var(--ok); margin-left: 5px; vertical-align: middle;
      box-shadow: 0 0 5px var(--ok);
      animation: blink 0.6s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

    /* FOOTER */
    .footer {
      padding: 8px 20px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      font-size: 9px;
      display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px;
      color: var(--w30);
      flex-shrink: 0;
      letter-spacing: 0.05em;
    }

    @media (max-width: 600px) {
      .header { padding: 10px 14px; }
      .telemetry-container { padding: 6px 10px; }
      
      .telemetry-badge {
        padding: 5px 6px;
        border-radius: 5px;
      }

      .stat-label {
        font-size: 7.5px;
        margin-bottom: 1px;
        letter-spacing: 0.02em;
      }

      .stat-value {
        font-size: 10.5px;
      }

      .log-entry { 
        padding: 3px 14px; 
        font-size: 10px; 
      }
      .log-entry:last-child { padding-left: 11px; }
      .footer { padding: 6px 14px; font-size: 8px; }
    }

    @media (max-width: 380px) {
      .telemetry-container { padding: 4px 6px; }
      .telemetry-badge { padding: 4px 2px; }
      .stat-label { font-size: 7px; }
      .stat-value { font-size: 9.5px; }
    }
  </style>
</head>
<body>
<div class="terminal">
  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <span class="brand">BACKUPNODE</span>
      <span class="brand-sub" id="brandSub">// Constant Link</span>
    </div>
  </div>

  <div class="telemetry-container">
    <div class="telemetry-badge" id="telemetryBadge">
      <div class="stat-item">
        <div class="stat-label">Threads</div>
        <div class="stat-value" id="s-nodes">32</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">Efficiency</div>
        <div class="stat-value" id="s-eff">99.8%</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">VRAM</div>
        <div class="stat-value" id="s-vram">88.42 GB</div>
      </div>
      <div class="stat-item">
        <div class="stat-label">AI Load</div>
        <div class="stat-value" id="s-load">14%</div>
      </div>
    </div>
  </div>

  <!-- LOG VIEWPORT -->
  <div class="log-viewport" id="logViewport">
    <div class="log-fade-top"></div>
    <div class="log-stream" id="logStream"></div>
  </div>

  <!-- FOOTER -->
  <div class="footer">
    <div>AI FORCE MULTIPLIER</div>
    <div>&copy; 2026 GREG NEOCITY ARR</div>
  </div>
</div>

<script>
const BROADCAST_MESSAGES = [
  "// Constant Link",
  "// MSG: Signal mapped to sublime",
  ];

  const MESSAGE_CHANGE_INTERVAL = 8000; // 8 seconds

  const viewport  = document.getElementById('logViewport');
  const stream    = document.getElementById('logStream');
  const brandSub  = document.getElementById('brandSub');
  const MAX_LINES = 60;

  const LOG_POOL = [
    { tag: 'infer',  msg: () => `Neural path resolved in ${rndInt(5,15)}ms | Accuracy: ${rnd(0.991,0.999)}`, bright: true },
    { tag: 'cache',  msg: () => `Context optimized: ${rndInt(500,2000)} tokens successfully cached` },
    { tag: 'stream', msg: () => `Data packet delivered to edge_node_${rndHex(2)} | Zero packet loss`, type: 'success' },
    { tag: 'sys',    msg: () => `Thermal status optimal | Fans operating at ${rndInt(15,30)}% capacity`, bright: true },
    { tag: 'net',    msg: () => `Secure handshake verified for cluster_${rndHex(4)} | Connection stable` },
    { tag: 'optim',  msg: () => `Speculative decoding: ${rnd(1.2,1.8)}x speedup achieved`, type: 'success' },
    { tag: 'sync',   msg: () => `Global weights synchronized across ${rndInt(8,64)} sub-nodes`, bright: true },
    { tag: 'perf',   msg: () => `Throughput peak detected: ${rndInt(1200,4500)} tok/sec | Stable operation` }
  ];

  function rnd(min, max)   { return (Math.random()*(max-min)+min).toFixed(3); }
  function rndInt(min, max){ return Math.floor(Math.random()*(max-min+1)+min); }
  function rndHex(len)     { return Math.random().toString(16).substring(2,2+len).toUpperCase(); }

  function updateStats() {
    document.getElementById('s-eff').textContent  = (98+Math.random()*1.9).toFixed(1)+'%';
    document.getElementById('s-vram').textContent = (88 + (Math.random() * 0.9)).toFixed(2) + ' GB';
    document.getElementById('s-load').textContent = rndInt(12,28)+'%';
    if (Math.random()>0.98)
      document.getElementById('s-nodes').textContent = Math.random()>0.5 ? '32' : '48';
  }

  let currentCursor = null;

  function addLog() {
    const data = LOG_POOL[Math.floor(Math.random()*LOG_POOL.length)];

    const entry = document.createElement('div');
    entry.className = 'log-entry';
    entry.innerHTML = `<span class="le-prefix">&gt;</span><span class="le-msg ${data.bright?'bright':''} ${data.type||''}">${data.msg()}</span>`;

    stream.appendChild(entry);

    if (currentCursor) currentCursor.remove();
    currentCursor = document.createElement('span');
    currentCursor.className = 'cursor';
    entry.querySelector('.le-msg').appendChild(currentCursor);

    while (stream.children.length > MAX_LINES) stream.removeChild(stream.firstChild);

    viewport.scrollTop = viewport.scrollHeight;

    if (Math.random()>0.7) updateStats();
  }

  let currentMsgIndex = 0;
  let isScrambling = false;

  function rotateHeaderMessage() {
    if (!BROADCAST_MESSAGES || BROADCAST_MESSAGES.length <= 1 || isScrambling) return;
    
    currentMsgIndex = (currentMsgIndex + 1) % BROADCAST_MESSAGES.length;
    const targetMsg = BROADCAST_MESSAGES[currentMsgIndex];
    const chars = '!@#$%^&*()_+-=[]{}|;:,.<>?/0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    
    isScrambling = true;
    brandSub.classList.add('highlight');

    let iteration = 0;
    const maxIterations = targetMsg.length;

    const interval = setInterval(() => {
      brandSub.textContent = targetMsg
        .split('')
        .map((char, index) => {
          if (index < iteration) {
            return targetMsg[index];
          }
          return chars[Math.floor(Math.random() * chars.length)];
        })
        .join('');

      if (iteration >= maxIterations) {
        clearInterval(interval);
        brandSub.textContent = targetMsg;
        isScrambling = false;
        setTimeout(() => {
          brandSub.classList.remove('highlight');
        }, 1000);
      }

      iteration += 1 / 2;
    }, 30);
  }

  function start() {
    addLog();
    setTimeout(start, Math.random()>0.9 ? rndInt(800,2500) : rndInt(100,600));
  }

  if (BROADCAST_MESSAGES.length > 0) {
    brandSub.textContent = BROADCAST_MESSAGES[0];
  }

  setInterval(rotateHeaderMessage, MESSAGE_CHANGE_INTERVAL);

  // Initial log entries
  for (let i=0; i<15; i++) setTimeout(addLog, i*60);
  setTimeout(start, 1000);
</script>
</body>
</html>
